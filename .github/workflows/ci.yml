# The checks AGENTS.md asks for before calling anything done, one job each, so a pull request shows
# which one failed and a lint error does not hide a failing test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    # svelte-check in both workspaces: TypeScript over .ts files and .svelte components alike.
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm check

  test:
    # Unit tests in Node, component tests in Chromium.
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: pnpm test

  build:
    # The site the deploy builds: the registry, then every docs page prerendered. A page or a
    # `<Preview>` that breaks fails here rather than in the Cloudflare build.
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  registry:
    # Builds the registry, then installs it into a throwaway SvelteKit project and type-checks
    # what lands there. This is the only job that exercises what a reader actually runs, so a
    # change to the generator or the aliases that breaks installs fails here rather than in
    # someone else's project.
    name: Registry installs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm registry
      - run: pnpm smoke
