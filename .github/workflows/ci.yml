name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Playwright drives the component tests in a real browser; `--with-deps` is what makes that
      # work on a bare runner.
      - run: pnpm --filter coral exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  registry:
    name: registry installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds the registry, then installs it into a throwaway SvelteKit project and type-checks
      # what lands there. This is the only job that exercises what a reader actually runs, so a
      # change to the generator or the aliases that breaks installs fails here rather than in
      # someone else's project.
      - run: pnpm registry
      - run: pnpm --filter coral smoke
