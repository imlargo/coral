# Not a monorepo. `packages` is stated explicitly anyway: some pnpm 10.x builds refuse to read a
# workspace file without it ("packages field missing or empty"), and `['.']` is exactly what pnpm
# documents as the default when the field is omitted - the root package and nothing else.
packages:
  - '.'

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@svmd/content@0.2.0'
  - '@svmd/core@0.2.0'
  - '@svmd/mdast-util-svelte@0.2.0'
  - '@svmd/micromark-extension-svelte@0.2.0'
  - '@svmd/micromark-factory-svelte-expression@0.2.0'
  - '@svmd/vite@0.2.0'

onlyBuiltDependencies:
  - workerd
  - esbuild
